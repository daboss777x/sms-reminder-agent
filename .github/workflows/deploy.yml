name: Deploy to Trigger.dev (prod)

on:
  push:
    branches:
      - main
  # Allows deploying manually from the Actions tab without pushing a commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      # The CLI version is pinned to match the @trigger.dev/sdk version in
      # package.json. Trigger.dev fails the deploy on a version mismatch, so
      # using @latest here would break the moment a new CLI ships.
      - name: 🚀 Deploy Trigger.dev
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: npx trigger.dev@4.5.15 deploy --external-id ${{ github.sha }}
